name: Staging

# Builds and deploys a live staging copy of the site at test.<domain> on every
# push to a non-main branch. Intended for solo, one-branch-at-a-time work: each
# push overwrites the single ':staging' image and refreshes one shared staging
# container (its own database volume, separate from production).
on:
  push:
    branches-ignore: [main]

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "/opt/fff-website"
          strip_components: 1
      - name: Pull and restart staging on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/fff-website
            # Derive the staging env from prod, overriding only the domain.
            PROD_DOMAIN=$(grep '^SITE_DOMAIN=' .env | cut -d= -f2-)
            sed -e "s|^SITE_DOMAIN=.*|SITE_DOMAIN=test.${PROD_DOMAIN}|" \
                -e "s|^AUTH_URL=.*|AUTH_URL=https://test.${PROD_DOMAIN}|" \
                .env > .env.staging
            docker compose pull app-staging
            docker compose up -d app-staging caddy
            # Restart Caddy so it reloads the synced Caddyfile and makes a
            # fresh certificate-issuance attempt. A restart (rather than a hot
            # reload) resets any ACME backoff left over from an earlier try
            # that raced ahead of the DNS record being created.
            docker compose restart caddy
            docker image prune -f
