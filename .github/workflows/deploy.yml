name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "/opt/fff-website"
          strip_components: 1
      - name: Pull and restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/fff-website
            # Derive the staging env from prod, overriding only the domain, so
            # .env.staging always exists (compose references it) and stays in
            # sync with prod secrets.
            PROD_DOMAIN=$(grep '^SITE_DOMAIN=' .env | cut -d= -f2-)
            sed -e "s|^SITE_DOMAIN=.*|SITE_DOMAIN=test.${PROD_DOMAIN}|" \
                -e "s|^AUTH_URL=.*|AUTH_URL=https://test.${PROD_DOMAIN}|" \
                .env > .env.staging
            docker compose pull app
            docker compose up -d app caddy
            # Restart Caddy so it picks up the synced Caddyfile (a bind-mount
            # content change alone does not recreate the container) and makes a
            # fresh certificate-issuance attempt for any newly added site.
            docker compose restart caddy
            docker image prune -f
